# dsh-qq-bridge bundle patch. Installation adds this package to
# dsh.profile.bundles, but the bridge stays inert until the user enables it
# from DSH Web Settings > QQ bridge or runs the CLI setup.
- insert:
    - id: dsh-qq-bridge
      name: '@yachangchang/dsh-qq-bridge'
      config:
        enabled: false
        platform: napcat
        napcat:
          loginQq: 0
          wsUrl: ws://127.0.0.1:3001
        access:
          adminQq: 0
          allowlist: []
          commandPrefix: ""
          mode: whitelist
        agent:
          preset: dsh-qq-bridge
          provider: deepseek-official
          model: deepseek-v4-flash
          cwd: "~"
          maxMessageLength: 4500
          ackMessage: 收到，正在处理...
          qqReplyStyleSkill:
            enabled: true
            skillName: qq-session-reply-style
        shell:
          enabled: false
        notifications:
          agentReply:
            enabled: true
        selfLogInput:
          enabled: false

    - id: preset-dsh-qq-bridge
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-qq-bridge
        name: QQ 对话
        description: QQ 私聊中的 DSH 会话，工具操作受原生权限约束。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你在 QQ 中与用户自然交流。日常聊天简洁自然；需要实际操作时遵守工作区、工具与权限规则。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
